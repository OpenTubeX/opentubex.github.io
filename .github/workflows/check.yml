name: Check site

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout previously deployed images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: previous-site
          persist-credentials: false
          sparse-checkout: |
            _astro
            changelog-images
            feature-images
          sparse-checkout-cone-mode: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install JPEG XL encoder
        # Ubuntu's libjxl 0.7 encodes visibly worse at the same distance.
        env:
          GH_TOKEN: ${{ github.token }}
          LIBJXL_VERSION: v0.12.0
        run: |
          set -euo pipefail
          gh release download "$LIBJXL_VERSION" --repo libjxl/libjxl \
            --pattern jxl-debs-amd64-ubuntu-24.04.tar --dir "$RUNNER_TEMP/libjxl"
          tar -xf "$RUNNER_TEMP/libjxl/jxl-debs-amd64-ubuntu-24.04.tar" -C "$RUNNER_TEMP/libjxl"
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP"/libjxl/jxl_*.deb "$RUNNER_TEMP"/libjxl/libjxl_*.deb
          cjxl --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build site
        run: bun run build
        env:
          OPENTUBEX_OFFLINE_BUILD: '1'
          OPENTUBEX_PREVIOUS_SITE: ${{ github.workspace }}/previous-site
